<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STAR TEST · Whole-Person Reports Preview</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7ff;color:#182b53;font:14px system-ui,-apple-system,sans-serif}header{background:#11224f;color:white;padding:16px;font-size:22px;font-weight:800}.wrap{max-width:1100px;margin:auto;padding:12px}.layout{display:grid;grid-template-columns:165px minmax(0,1fr);gap:12px}.nav,.panel{background:white;border:1px solid #cbd5e8;border-radius:12px;padding:13px;margin-bottom:12px}.nav button{width:100%;display:block;text-align:left;border:0;background:white;color:#233d69;padding:12px 8px;border-radius:7px;font-weight:650}.nav button.active{background:#ffebc9}.panel h2{background:#e8eeff;padding:10px;margin:-13px -13px 12px;font-size:16px;border-radius:12px 12px 0 0}select{width:100%;min-width:0;padding:11px;border:1px solid #b9c8df;border-radius:8px;background:white;color:#182b53}.filters,.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.filters label{font-weight:700;font-size:12px}.entry{border-bottom:1px solid #e0e6f1;padding:10px 0;line-height:1.55}.entry:last-child{border:0}.muted{color:#61718c;font-size:12px}.tag{display:inline-block;border-radius:12px;padding:3px 7px;background:#e5f4eb;color:#19653e}.bar{background:#e8edf6;border-radius:10px;height:12px;overflow:hidden;margin:6px 0}.bar span{display:block;background:#5e9a98;height:100%}.metric{display:inline-block;margin-right:20px;font-weight:750}a{color:#255a9c}button{cursor:pointer}svg{max-width:100%;height:auto}.notice{background:#fff4d8;padding:11px;border-radius:8px;margin-bottom:12px}@media(max-width:650px){.layout{display:block}.nav{display:flex;overflow-x:auto;gap:5px;padding:6px}.nav button{width:auto;white-space:nowrap;flex:none}.cols{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}}@media print{.nav,.notice,.filters{display:none}.layout{display:block}}</style></head><body><header>⭐ STAR · Reports</header><div class="wrap"><div class="notice"><strong>UVM DESIGN PREVIEW — fictional example data only.</strong> This page does not save to Supabase or replace the existing reports. <a href="isa-progress-report.html">Open existing ISA report</a> · <a href="isa-outcomes.html">ISA outcomes</a></div><div class="layout"><nav class="nav" id="nav"></nav><main><section class="panel"><strong id="heading">ISA Outcome Review — Whole-Person View</strong><div class="filters" style="margin-top:12px"><label>Reporting period<select id="period"><option value="all">Last 3 months</option><option value="month">This month</option></select></label><label>ISA goal<select id="goal"><option value="community">Community Participation</option><option value="daily">Daily Living Skills</option><option value="vocational">Employment & Vocational</option></select></label></div><p class="muted">Jamie Rivers · fictional UVM demonstration</p></section><div id="content"></div></main></div></div><script>
const pages=['ISA Goals','Individual Voice','Check-ins','More Charts','Health Calendar','Letters'];let page='ISA Goals';const goals={community:{name:'Community Participation',unit:'Minutes participating',support:'Community support',records:[['Sep 8','Library introduction','Library',30,'Frequent verbal prompts',null],['Oct 6','Shop visit','Local shop',45,'Extra support and quiet break','The shop was too busy. I wanted somewhere quieter.'],['Nov 8','Library visit','Library',60,'Occasional verbal prompts','I liked choosing a book at the library.']]},daily:{name:'Daily Living Skills',unit:'Minutes engaged',support:'In-home support',records:[['Sep 8','Clean-up','At home',10,'Frequent prompts',null],['Oct 6','Food preparation','At home',20,'Modeling and prompts','I helped make lunch.'],['Nov 8','Prepare a snack','At home',25,'Picture steps','I liked picking my own snack.']]},vocational:{name:'Employment & Vocational',unit:'Minutes participating',support:'Employment support',records:[['Sep 8','Introductory task','Workplace',20,'Frequent prompts',null],['Oct 6','Workplace orientation','Workplace',30,'Extra support','It was too busy.'],['Nov 8','Organize supplies','Workplace',40,'Verbal prompts','I liked putting things in order.']]}};const $=s=>document.querySelector(s),panel=(title,body)=>'<section class="panel"><h2>'+title+'</h2>'+body+'</section>';function render(){const g=goals[$('#goal').value],records=$('#period').value==='month'?g.records.slice(-1):g.records;$('#nav').innerHTML=pages.map(p=>'<button data-page="'+p+'" class="'+(page===p?'active':'')+'">'+p+'</button>').join('');$('#heading').textContent=page==='ISA Goals'?'ISA Outcome Review — Whole-Person View':page;let rows=records.map(r=>'<div class="entry"><b>'+r[0]+' · '+r[1]+'</b><div>Location: '+r[2]+' · Support: '+g.support+' · '+r[3]+' minutes</div><div>Assistance: '+r[4]+'</div><div class="muted">Individual: '+(r[5]?'“'+r[5]+'”':'No response recorded')+'</div></div>').join(''),voice=records.map(r=>'<div class="entry"><b>'+r[0]+' · '+r[1]+'</b><p>'+(r[5]?'“'+r[5]+'”':'No linked response recorded')+'</p></div>').join(''),bars=records.map(r=>'<div class="entry">'+r[0]+' · '+r[1]+' <b>'+r[3]+' min</b><div class="bar"><span style="width:'+Math.min(100,r[3]/70*100)+'%"></span></div></div>').join('');let summary='<p class="metric">'+records.length+' activities</p><p class="metric">'+records.reduce((a,r)=>a+r[3],0)+' minutes</p><p class="muted">All values shown are fictional, not verified Supabase records.</p>';$('#content').innerHTML=page==='ISA Goals'?panel('📈 Participation Over Time',bars)+panel('📊 At-a-Glance',summary)+ '<div class="cols">'+panel('📋 Caregiver Observations',rows)+panel('💬 Jamie’s Voice (My STAR)',voice)+'</div>'+panel('♡ Supports & Experience Summary',rows)+panel('▥ Progress Summary (Team Use)','<p>Recorded change: '+records[0][3]+' to '+records[records.length-1][3]+' minutes. Review assistance and individual preferences alongside the measurements.</p><p class="muted">No automatic determination of outcome completion.</p>')+panel('👥 Team Review','<p>Review notes and determinations will be saved only after integration with existing STAR role permissions and Supabase.</p>'):page==='Individual Voice'?panel('Individual Voice',voice):page==='Check-ins'?panel('Caregiver Check-ins',rows):page==='More Charts'?panel('Supports, Locations & Time',bars+rows):page==='Health Calendar'?panel('Existing Health Calendar','<p>The existing month-by-month Health Calendar remains unchanged.</p><a href="health-calendar.html">Open existing calendar</a>'):panel('Existing Provider Letters','<p>The existing Provider Letters feature retains its established wording and structure.</p><a href="caregiver-report.html">Open existing caregiver report</a>');}$('#nav').addEventListener('click',e=>{if(e.target.dataset.page){page=e.target.dataset.page;render()}});$('#goal').addEventListener('change',render);$('#period').addEventListener('change',render);render();
</script></body></html>
