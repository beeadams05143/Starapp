<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>STAR Authentication</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2026.10.26A" />
  <link rel="icon" type="image/png" href="/favicon.png?v=2026.10.26A" />
  <meta name="apple-mobile-web-app-title" content="STAR" />
  <meta name="theme-color" content="#F5F2EC" />
  <style>
    :root {
      --page-bg: #F5F2EC;
      --card-bg: #FFFFFF;
      --card-border: #E7E2D8;
      --input-bg: #F9F7F3;
      --input-border: #D8D2C8;
      --button-bg: #EDE6DA;
      --button-hover: #E5DCCE;
      --text: #2C2C2A;
      --muted: #5F5E5A;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--page-bg);
      color: var(--text);
    }
    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      width: min(100%, 420px);
    }
    .auth-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid var(--card-border);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 22px;
    }
    .star {
      font-size: 28px;
      line-height: 1;
      margin-bottom: 6px;
    }
    .auth-header h1 {
      margin: 0 0 6px;
      font-size: 28px;
      letter-spacing: 2px;
      color: var(--text);
      font-weight: 700;
    }
    .tagline {
      margin: 0;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }
    label {
      display: block;
      margin: 0 0 6px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
    }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--input-border);
      margin-bottom: 12px;
      background: var(--input-bg);
      color: var(--text);
      font: inherit;
    }
    input:focus {
      outline: 2px solid #D8D2C8;
      outline-offset: 1px;
    }
    .checkbox {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 4px 0 16px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      cursor: pointer;
    }
    .checkbox input {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      margin: 1px 0 0;
      accent-color: #7C6ACF;
      cursor: pointer;
    }
    .checkbox a {
      color: #5B4636;
      font-weight: 500;
    }
    .primary-btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: var(--button-bg);
      color: var(--text);
      font: inherit;
      font-weight: 500;
      cursor: pointer;
    }
    .primary-btn:hover {
      background: var(--button-hover);
    }
    .primary-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    #message {
      min-height: 20px;
      margin-top: 14px;
      color: #9F2F2F;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
    }
    #message.ok {
      color: #2F6F4F;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="card auth-card">
      <div class="auth-header">
        <div class="star">★</div>
        <h1>STAR</h1>
        <p class="tagline">Support Tool for Autonomy and Reflection.</p>
      </div>

      <form id="authForm" novalidate>
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" placeholder="you@example.com" required />

        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="Your password" required />

        <label id="consentRow" class="checkbox" for="consentCheck">
          <input id="consentCheck" type="checkbox" />
          <span>
            I agree to the
            <a href="/privacy-policy.html" target="_blank">Privacy Policy</a>
            and
            <a href="/terms.html" target="_blank">Terms of Service</a>
          </span>
        </label>

        <button id="continueBtn" class="primary-btn" type="submit">Sign in to STAR TEST</button>
        <button id="registerBtn" class="primary-btn" type="button" style="margin-top:10px;background:#fff1cf;border:1px solid #b78d45">Create my test account</button>
        <p style="font-size:12px;line-height:1.5;color:#62584b">This is a separate testing login. Use a new password, never your live STAR password. Only fictional records belong here.</p>
      </form>
      <div id="message" role="status" aria-live="polite"></div>
    </div>
  </div>

  <script type="module">
    import {
      SUPABASE_URL,
      SUPABASE_ANON_KEY,
      saveSession,
      getSessionFromStorage,
      clearSavedSession,
    } from './supabaseClient.js?v=2026.10.29UVM2';
    import { loadAndRunRouter } from './routerLoader.js?v=2026.05.07';

    const ROLE_SELECT_URL = 'role-select.html';
    const form = document.getElementById('authForm');
    const emailEl = document.getElementById('email');
    const passwordEl = document.getElementById('password');
    const continueBtn = document.getElementById('continueBtn');
    const registerBtn = document.getElementById('registerBtn');
    const messageEl = document.getElementById('message');
    const EMAIL_REGEX = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    function setMessage(text, ok = false) {
      messageEl.textContent = text || '';
      messageEl.classList.toggle('ok', !!ok);
    }

    function setBusy(on) {
      continueBtn.disabled = on;
      registerBtn.disabled = on;
    }

    function validateEmail(email) {
      return EMAIL_REGEX.test(email || '') ? '' : 'Please enter a valid email address';
    }

    function validatePassword(password) {
      if ((password || '').length < 8) return 'Password must be at least 8 characters';
      const hasNumberOrSymbol = /[0-9!@#$%^&*]/.test(password || '');
      return hasNumberOrSymbol ? '' : 'Password must include at least one number or special character';
    }

    function normalizeSession(payload) {
      if (!payload || typeof payload !== 'object') return null;
      if (payload.session) return payload.session;
      if (!payload.access_token) return null;
      return {
        access_token: payload.access_token,
        refresh_token: payload.refresh_token || null,
        expires_in: payload.expires_in ?? null,
        expires_at:
          payload.expires_at ??
          (payload.expires_in ? Math.floor(Date.now() / 1000) + Number(payload.expires_in || 0) : null),
        token_type: payload.token_type || 'bearer',
        user: payload.user ?? null,
      };
    }

    async function requestAuth(path, body) {
      const response = await fetch(`${SUPABASE_URL}${path}`, {
        method: 'POST',
        headers: {
          apikey: SUPABASE_ANON_KEY,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(body),
      });
      const text = await response.text();
      const payload = text ? JSON.parse(text) : null;
      if (!response.ok) {
        const message =
          payload?.error_description ||
          payload?.error ||
          payload?.message ||
          text ||
          'Authentication failed';
        const error = new Error(message);
        error.payload = payload;
        error.status = response.status;
        throw error;
      }
      const session = normalizeSession(payload);
      if (session) saveSession(session);
      return payload;
    }

    async function logIn(email, password) {
      return requestAuth('/auth/v1/token?grant_type=password', { email, password });
    }

    async function signUp(email, password) {
      return requestAuth('/auth/v1/signup', { email, password });
    }

    const forceNewLogin = new URLSearchParams(location.search).has('reauth');
    if (forceNewLogin) {
      clearSavedSession();
      setMessage('Your STAR TEST session expired. Please sign in again.');
    } else if (getSessionFromStorage()?.user?.id) {
      void loadAndRunRouter();
    }
    async function handleCredentials(mode) {
      setMessage('');
      setBusy(true);
      try {
        const consentCheck = document.getElementById('consentCheck');
        if (!consentCheck.checked) throw new Error('Please agree to the Privacy Policy and Terms of Service to continue.');
        const email = (emailEl.value || '').trim();
        const password = passwordEl.value || '';
        const emailError = validateEmail(email);
        if (emailError) throw new Error(emailError);
        const passwordError = validatePassword(password);
        if (passwordError) throw new Error(passwordError);

        if (mode === 'register') {
          // New Supabase projects generally require email confirmation.
          const response = await signUp(email,password);
          if (!response?.access_token && !response?.session) {
            setMessage('Check your email for the STAR TEST verification link. After confirming, return here and choose Sign in.',true);
            return;
          }
        } else {
          await logIn(email,password);
        }
        const session = getSessionFromStorage();
        if (!session?.user?.id) throw new Error('Account created, but sign-in still requires email confirmation.');
        try { localStorage.setItem('user_id', session.user.id); } catch {}
        setMessage('STAR TEST sign-in successful! Redirecting…',true);
        void loadAndRunRouter();
      } catch (error) {
        console.error('[STAR TEST AUTH]',error?.message||error);
        setMessage(error?.message || 'Sign-in was not completed.');
      } finally {
        setBusy(false);
      }
    }
    form.addEventListener('submit',event=>{event.preventDefault();void handleCredentials('login')});
    registerBtn.addEventListener('click',()=>{void handleCredentials('register')});
  </script>
<script defer src="/sandbox-ribbon.js?v=2026.10.26A"></script>
</body>
</html>
