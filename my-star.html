<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f1e6">
  <title>My STAR</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #272b29; background: #f7f1e6 }
    * { box-sizing: border-box }
    body { margin: 0 }
    main { width: min(860px, 100%); margin: auto; padding: 16px 15px 32px }
    h1 { font-size: clamp(28px, 6vw, 38px) }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px }
    .tile, .choice { border: 2px solid #d5c8b1; border-radius: 20px; background: #fffdf7; color: inherit; text-align: center; padding: 14px 8px; min-height: 112px; display: grid; align-content: center; justify-items: center; gap: 8px; font: inherit; font-size: clamp(16px, 4.5vw, 22px); font-weight: 750; text-decoration: none; cursor: pointer }
    .face { font-size: clamp(28px, 8vw, 48px); line-height: 1.2 }
    .panel { padding: 16px; border: 2px solid #d5c8b1; border-radius: 20px; background: #fffdfa }
    fieldset { border: 0; margin: 0; padding: 0 }
    legend { margin-bottom: 14px }
    .choice { position: relative }
    .choice input { position: absolute; opacity: 0 }
    .choice:has(input:checked) { border-color: #366c48; background: #e8f3e7 }
    .choice:focus-within, :focus-visible { outline: 3px solid #2c5f75; outline-offset: 3px }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px }
    .action { display: inline-flex; align-items: center; min-height: 48px; border: 2px solid #b9ad97; padding: 9px 15px; border-radius: 14px; background: white; color: inherit; font: inherit; font-weight: 750; text-decoration: none; cursor: pointer }
    .primary { color: white; background: #3d614c; border-color: #3d614c }
    .primary:disabled { opacity: .65; cursor: default }
    #saveStatus { margin-bottom: 0; font-weight: 700 }
    #saveStatus:empty { display: none }
    [hidden] { display: none !important }
  </style>
  <script defer src="/ui-shell.js?v=2026.11.19A"></script>
  <script defer src="/scripts/appbar-drawer.js?v=2026.11.19A"></script>
  <script type="module" src="/my-star.js?v=2026.11.19B"></script>
</head>
<body>
  <main>
    <h1 id="heading">My STAR ☆</h1>
    <p id="loadStatus" role="status">Loading My STAR…</p>
    <section id="home" hidden>
      <div class="grid">
        <a class="tile" href="?page=feel"><span class="face" aria-hidden="true">😊 😐 😟</span>This Is How I Feel</a>
        <a class="tile" href="/chat.html" id="groupChat"><span class="face" aria-hidden="true">💬</span>My Team Chat</a>
        <a class="tile" href="/wouldyourather.html"><span class="face" aria-hidden="true">🏠 🌳</span>Would You Rather?</a>
        <a class="tile" href="/my-star-voice.html"><span class="face" aria-hidden="true">🖼️</span>Picture Communication</a>
      </div>
    </section>
    <form id="moodForm" class="panel" hidden>
      <fieldset id="moodChoices">
        <legend>Pick a face. You can skip this.</legend>
        <div class="grid">
          <label class="choice"><input type="radio" name="mood" value="😊 Happy" required><span class="face" aria-hidden="true">😊</span>Happy</label>
          <label class="choice"><input type="radio" name="mood" value="🙂 OK"><span class="face" aria-hidden="true">🙂</span>Okay</label>
          <label class="choice"><input type="radio" name="mood" value="😢 Sad"><span class="face" aria-hidden="true">😢</span>Sad</label>
          <label class="choice"><input type="radio" name="mood" value="😠 Upset"><span class="face" aria-hidden="true">😠</span>Upset</label>
          <label class="choice"><input type="radio" name="mood" value="😴 Tired"><span class="face" aria-hidden="true">😴</span>Tired</label>
          <label class="choice"><input type="radio" name="mood" value="🤒 Sick"><span class="face" aria-hidden="true">🤒</span>Not feeling good</label>
        </div>
      </fieldset>
      <div class="actions">
        <button class="action" id="readAloud" type="button" hidden>🔊 Read aloud</button>
        <button class="action primary" id="saveMood" type="submit">Done</button>
        <a class="action" id="back" href="/my-star.html">Not now</a>
      </div>
      <p id="saveStatus" role="status"></p>
    </form>
  </main>
</body>
</html>
