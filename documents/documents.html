<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Documents</title>
  <style>
    :root{
      --ink:#2C2C2A;
      --accent:#FAEEDA;
      --paper:#FFFFFF;
      --rule:#E7E2D8;
      --punch:#d1d5db;
      --color-background-primary:#FFFFFF;
      --color-background-secondary:#F9F7F3;
      --color-border-secondary:#D8D2C8;
      --color-border-tertiary:#E7E2D8;
      --sans:"Avenir Next","Segoe UI","Helvetica Neue",Arial,sans-serif;
      --serif:Georgia,"Iowan Old Style","Palatino Linotype","Book Antiqua",serif;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      padding:0 24px 24px;
      font-family:var(--sans);
      background:#F5F2EC;
      color:var(--ink);
    }
    .page{max-width:1200px; margin:0 auto;}

    /* Notebook */
    .notebook{position:relative; border-radius:16px; overflow:hidden; box-shadow:none; display:block; background:var(--paper); border:0.5px solid var(--color-border-tertiary)}
    .paper{
      padding:0 24px 28px; position:relative;
      background:#FFFFFF;
    }
    .paper:before{display:none;}
    .pencil{display:none}
    h1{
      margin:0;
      font-family:var(--sans);
      font-size:17px;
      font-weight:500;
      color:#2C2C2A;
      letter-spacing:.01em;
    }
    label{display:block; font-weight:600; margin:6px 0 6px}
    input[type="text"], input[type="datetime-local"], select, textarea{
      width:100%; padding:10px 12px; border:0.5px solid var(--color-border-secondary); border-radius:10px; font-size:16px; background:var(--color-background-secondary); outline:none;
    }
    textarea{min-height:140px; line-height:30px;
      background:var(--color-background-secondary);
    }
    .grid2{display:grid; gap:12px; grid-template-columns:1fr 1fr}
    .divider{height:1px; background:#f1f5f9; margin:16px 0}
    .btn{appearance:none; border:0.5px solid #FAC775; background:#FAEEDA; color:#633806; padding:12px 16px; border-radius:12px; cursor:pointer; font-size:14px; font-weight:500}
    .btn.secondary{background:var(--color-background-secondary); color:var(--color-text-primary,#2C2C2A); border-color:var(--color-border-tertiary)}
    .muted{color:#6b7280; font-size:13px}
    .card{border:0.5px solid var(--color-border-tertiary); border-radius:12px; padding:14px 16px; margin-top:10px; background:var(--color-background-primary)}
    .row{display:flex; gap:8px; align-items:center; justify-content:space-between}
    .doc-header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-top:22px}
    .doc-header h2{
      margin:0;
      font-family:var(--sans);
      font-size:clamp(1.8rem, 3vw, 2.4rem);
      font-weight:700;
      color:#633806;
    }
    .doc-page-note{margin:6px 0 0;color:#6b7280;font-size:14px;font-style:italic}
    .doc-attachment-preview{
      margin-top:10px;
      border:1px solid #e5e7eb;
      border-radius:12px;
      background:#f8fafc;
      padding:8px;
      display:flex;
      flex-direction:column;
      gap:8px;
      cursor:pointer;
      width:100%;
      text-align:left;
    }
    .doc-attachment-preview img{
      width:100%;
      max-height:240px;
      object-fit:contain;
      border-radius:10px;
      background:#fff;
    }
    .doc-attachment-preview .preview-label{
      font-size:12px;
      font-weight:700;
      color:#64748b;
    }
    .doc-attachment-preview .preview-status{
      font-size:12px;
      color:#94a3b8;
    }
    .doc-attachment-preview.has-image .preview-status{ display:none; }

    @media (max-width: 720px) {
      body{padding:12px}
      .notebook{grid-template-columns:1fr}
      .paper{padding:0 16px 120px}
      .grid2{grid-template-columns:1fr}
      .doc-header{flex-direction:column;align-items:flex-start}
      .doc-header button{width:100%}
      textarea{min-height:120px;line-height:24px}
    }


    /* Hide Group switcher (navbar) on docs pages */
    #group-switcher, label[for="group-switcher"], #groupSwitcherStatus { display:none !important; }

    .isa-only{display:none}
    .isa-only.is-visible{display:block}
    .isa-links.is-visible,
    .btn.isa-only.is-visible{display:inline-flex}
    .isa-helper{
      margin:8px 0 0;
      color:#6b7280;
      font-size:13px;
      line-height:1.45;
      font-style:italic;
    }
    .isa-links{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:12px;
    }
    .upload-chooser{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      margin-top:8px;
    }
    .upload-file-name{
      color:#6b7280;
      font-size:14px;
    }
    .starfield-page-header{position:relative;overflow:hidden;text-align:center;background:#F5F2EC;color:#2C2C2A;padding:32px 16px 22px;margin:0 -24px 18px;}
    .starfield-bg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
    .starfield-header-content{position:relative;z-index:1;display:grid;justify-items:center;gap:6px;}
    .header-star{width:22px;height:22px;display:block;}
  </style>
</head>
<body data-doc-page="docs">
  <!-- Shared navbar -->
  <div id="navbar"></div>

  <div class="page">
    <!-- Main content -->
    <div>
      <div class="notebook">
        <div class="paper">
          <section class="starfield-page-header">
            <svg class="starfield-bg" viewBox="0 0 420 110" aria-hidden="true">
              <circle cx="28" cy="18" r="1" fill="#2C2C2A" opacity="0.15"></circle><circle cx="80" cy="10" r="0.7" fill="#2C2C2A" opacity="0.12"></circle><circle cx="130" cy="28" r="0.9" fill="#2C2C2A" opacity="0.1"></circle><circle cx="200" cy="8" r="0.7" fill="#2C2C2A" opacity="0.1"></circle><circle cx="260" cy="22" r="0.6" fill="#2C2C2A" opacity="0.1"></circle><circle cx="340" cy="14" r="0.8" fill="#2C2C2A" opacity="0.12"></circle><circle cx="390" cy="28" r="1" fill="#2C2C2A" opacity="0.15"></circle><circle cx="50" cy="55" r="0.7" fill="#2C2C2A" opacity="0.1"></circle><circle cx="150" cy="65" r="0.8" fill="#2C2C2A" opacity="0.1"></circle><circle cx="300" cy="50" r="0.8" fill="#2C2C2A" opacity="0.12"></circle><circle cx="400" cy="68" r="0.7" fill="#2C2C2A" opacity="0.1"></circle>
              <polygon points="60,20 61.4,24.4 66,24.4 62.4,27 63.8,31.4 60,28.8 56.2,31.4 57.6,27 54,24.4 58.6,24.4" fill="#2C2C2A" opacity="0.25"></polygon><polygon points="365,10 366.2,13.8 370.2,13.8 367,16 368.2,19.8 365,17.6 361.8,19.8 363,16 359.8,13.8 363.8,13.8" fill="#2C2C2A" opacity="0.2"></polygon>
            </svg>
            <div class="starfield-header-content">
              <svg class="header-star" viewBox="0 0 24 24" fill="none" stroke="#2C2C2A" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><polygon points="12,2 14.9,9.3 22.6,9.3 16.4,14 18.8,21.5 12,17.2 5.2,21.5 7.6,14 1.4,9.3 9.1,9.3"></polygon></svg>
              <h1 id="formHeading">Add Document — <span id="catLabel">Finance</span></h1>
            </div>
          </section>
          <p id="formSubheading" class="doc-page-note"></p>
          <p id="editNotice" class="muted" style="display:none;margin:6px 0 0;">
            Editing this document. Uploading a new file will replace the current attachment.
          </p>

          <form id="doc-form-pretty">
            <input type="hidden" id="docCategory" value="Finance" />

            <div class="grid2">
              <div>
                <label for="docTitle">Title</label>
                <input id="docTitle" type="text" placeholder="e.g., Invoice 1032 / Guardianship Renewal" />
              </div>
              <div>
                <label for="docDate">Document Date</label>
                <input id="docDate" type="datetime-local" />
              </div>
            </div>

            <div class="grid2" style="margin-top:8px">
              <div>
                <label for="docType">Type</label>
                <select id="docType">
                  <option value="upload">Upload (General)</option>
                  <option value="appointment_notes">Appointment Notes</option>
                  <option value="email">Email</option>
                  <option value="text">Text</option>
                  <option value="other">Other</option>
                </select>
              </div>
              <div>
                <label for="docTags">Tags (comma separated)</label>
                <input id="docTags" type="text" placeholder="medical, school, ISA" />
              </div>
            </div>

            <div class="divider"></div>

            <label for="docDescription">Description / Notes</label>
            <textarea id="docDescription" placeholder="Short description or notes…"></textarea>
            <div id="isaMeetingLinks" class="isa-links">
              <a class="btn secondary" href="/documents/minutes-form.html">Add Meeting Minutes</a>
            </div>

            <!-- Medical-only extras (shows when the Medical tab is active) -->
            <div id="medicalExtras" style="display:none">
              <div class="divider"></div>
              <h3 style="margin:0 0 8px">Medical Details</h3>

              <div class="grid2">
                <div>
                  <label for="medicalNextDate">Next Appointment Date/Time</label>
                  <input id="medicalNextDate" type="datetime-local" />
                </div>
                <div>
                  <label for="medicalNextLink">Meeting Link (Telehealth)</label>
                  <input id="medicalNextLink" type="text" placeholder="https://zoom.us/... or https://teams.microsoft.com/..." />
                </div>
              </div>

              <label for="medicalNotes" style="margin-top:8px">Appointment Notes / Instructions</label>
              <textarea id="medicalNotes" placeholder="e.g., No allergy medication two weeks prior; bring ID & insurance card…"></textarea>
            </div>

            <label for="docFile" class="section" style="margin-top:8px">Attach File (optional)</label>
            <div class="upload-chooser">
              <input id="docFile" type="file" accept=".pdf,.jpg,.jpeg" hidden />
              <span id="docFileName" class="upload-file-name">No file chosen yet.</span>
            </div>
            <div class="muted">Upload JPG or PDF only. Files are private; the app uses time-limited links for viewing.</div>

            <div style="margin-top:14px">
              <button class="btn" type="submit" id="docSubmitBtn">Save Document</button>
              <button class="btn secondary" type="button" id="docCancelEdit" style="display:none">Cancel Edit</button>
            </div>
          </form>
        </div>

      </div>

      <div class="doc-header">
        <div>
          <h2><span id="catListLabel">Finance Documents</span></h2>
          <p id="docListSubheading" class="doc-page-note"></p>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn secondary" type="button" id="docsMeetingMinutesBtn">View Meeting Minutes</button>
          <button class="btn secondary" type="button" id="docsNotesBtn">View Notes</button>
          <button class="btn secondary" type="button" id="docsPrintBtn">View / Print</button>
          <button class="btn secondary" type="button" id="docsSharePinBtn">Set Share PIN</button>
        </div>
      </div>
      <div id="docs-list"></div>
    </div>

  </div>

 <!-- documents page logic (module) -->
<script type="module" src="/documents/documents.js?v=2026.03.16B"></script>

<!-- site shell: drawer + bars + floating avatar  -->
<script defer src="/scripts/appbar-drawer.js?v=2026.03.16B"></script>
<script defer src="/ui-shell.js?v=2026.03.16B"></script>
<script type="module" src="/avatar-float.js?v=2026.03.16B"></script>
</body>
</html>
