<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Whole-Person Reports · STAR</title>
<style>:root{font-family:system-ui,-apple-system,sans-serif;color:#13234b;background:#f4f6fc}*{box-sizing:border-box}body{margin:0}header{background:#12244f;color:white;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}header strong{font-size:25px}nav{display:flex;gap:5px;flex-wrap:wrap}button,select,textarea{font:inherit}button{cursor:pointer}nav button{background:transparent;border:0;color:white;padding:9px;border-radius:8px}nav button.active{background:#27618c}main{max-width:1200px;margin:auto;padding:18px}h1{font-size:clamp(22px,3vw,31px);margin:0 0 17px}.layout{display:grid;grid-template-columns:170px minmax(0,1fr);gap:14px}.side,.panel{border:1px solid #c7d1e5;background:white;border-radius:12px;padding:14px;box-shadow:0 1px 3px #ddd}.side button{display:block;width:100%;text-align:left;border:0;border-radius:8px;background:transparent;padding:12px 8px;color:#13234b}.side button.active{background:#fff0ce;font-weight:700}.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.filters label{flex:1;min-width:140px;font-weight:650;font-size:13px}select{display:block;width:100%;padding:10px;border:1px solid #bfc9dc;border-radius:8px;margin-top:5px;background:white;color:#15234a}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.panel h2{font-size:17px;margin:0 0 12px;background:#eaf0ff;padding:9px;border-radius:7px}.panel p{line-height:1.5;margin:8px 0}.metric{display:flex;justify-content:space-between;border-bottom:1px solid #e3e7ee;padding:10px 0;gap:10px}.entry{border:1px solid #d8dfea;border-radius:10px;padding:11px;margin:8px 0;line-height:1.5}.muted{color:#5e6982}.positive{color:#177544}.negative{color:#aa3c47}.full{grid-column:1/-1}.chart{width:100%;height:auto}.choice{display:block;padding:8px}.primary{background:#183b78;color:white;border:0;border-radius:8px;padding:11px 18px}.hidden{display:none}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.day{border:1px solid #dce2ee;border-radius:7px;min-height:52px;padding:6px;font-size:12px;background:white;color:#13234b}.day.event{background:#e5f1f0;border-color:#7daaa4}.day:focus{outline:3px solid #3b75b9}textarea{width:100%;min-height:85px;padding:9px;border:1px solid #bdc9dc;border-radius:8px}.pill{display:inline-block;background:#eaf1fb;border-radius:20px;padding:5px 10px;font-size:12px}.small{font-size:13px}#notice{margin-top:10px;color:#16713d}footer{margin-top:18px;color:#69738a;font-size:12px}@media(max-width:650px){main{padding:10px}.layout{display:block}.side{display:flex;overflow:auto;gap:5px;margin-bottom:12px;padding:7px;white-space:nowrap}.side button{width:auto;flex-shrink:0;padding:10px}.cards{grid-template-columns:1fr}.panel{padding:11px}.filters label{min-width:calc(50% - 8px)}header{padding:11px}header nav button:not(.active){display:none}h1{font-size:22px}.day{min-height:42px;padding:3px}}
</style>
<script type="module" src="./whole-person-reports-live.js"></script></head>
<body><header><strong>⭐ STAR</strong><a href="./caregiver-report.html">← Back to Reports</a></header>
<main><h1>⭐ ISA Outcome Review — Whole-Person View</h1>
<div class="layout"><nav class="side" id="menu" aria-label="Report sections">
<button data-page="letters">📄 Letters</button><button class="active" data-page="isa">⭐ ISA Goals</button><button data-page="voice">🗣️ Individual Voice</button><button data-page="checkins">📝 Check-ins</button><button data-page="health">🗓️ Health Calendar</button><button data-page="charts">📊 More Charts</button>
</nav><section><div class="panel"><div class="filters">
<label>Individual<select id="individual" disabled></select></label>
<label>Reporting period<select id="period"><option value="3">Last 3 Months</option><option value="1">This Month</option><option value="all">All available dates</option></select></label>
<label>ISA outcome<select id="goal"></select></label>
</div><p id="dataStatus" class="small muted" role="status">Loading saved records…</p></div>
<section id="isa" class="page"></section><section id="voice" class="page panel hidden"></section>
<section id="checkins" class="page panel hidden"></section><section id="letters" class="page panel hidden"></section>
<section id="charts" class="page panel hidden"></section>
<section id="health" class="page panel hidden"><h2>Health Calendar</h2><p class="small muted"></p><label>Choose a date <input type="date" id="eventDate"></label><p id="eventDetails" role="status"></p></section>
</section></div></main></body></html>
