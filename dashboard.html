<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2026.10.26A"><link rel="icon" type="image/png" href="/favicon.png?v=2026.10.26A"><meta name="apple-mobile-web-app-title" content="STAR"><meta name="theme-color" content="#F5F2EC"><title>Your STAR home</title><link rel="stylesheet" href="role-home.css?v=2026.11.09-tiles"></head><body>
<main><div id="homeStatus" role="status">Opening your STAR home…</div><div aria-live="polite"><section class="home-help-notice" id="homeHelpNotice" hidden><strong id="homeHelpTitle"></strong><br><a href="chat.html">Open Group Chat</a></section></div><section id="roleHome" class="role-screen" hidden></section><section id="activitySection" hidden><h2>Recent team activity</h2><div id="activityBannerHost" aria-live="polite"></div></section><p><a href="auth.html">Account & sign-in</a></p></main>
<script type="module" src="role-dashboard.js?v=2026.11.09-tiles"></script>
<script type="module">
  import {getSessionFromStorage, rest} from './restClient.js?v=2026.10.29UVM3';
  import {ensureActiveGroupId} from './active-group.js?v=2026.10.29UVM3';

  import {unreadMessagesQuery} from './chat-alerts.js?v=2026.11.07-shared-alerts';
  const notice=document.getElementById('homeHelpNotice');
  const title=document.getElementById('homeHelpTitle');
  let refreshing=false;
  async function refreshHelpNotice(){
    if(refreshing || document.hidden)return;
    refreshing=true;
    try{
      const userId=getSessionFromStorage()?.user?.id;
      if(!userId){notice.hidden=true;return;}
      const groupId=await ensureActiveGroupId(userId);
      if(!groupId){notice.hidden=true;return;}
      const query=unreadMessagesQuery(userId,groupId,{helpOnly:true});
      const rows=await rest('messages?'+query,{expectedUserId:userId});
      if(getSessionFromStorage()?.user?.id!==userId){notice.hidden=true;return;}
      const latest=rows[0]?.message;
      if(latest){
        const label=latest.startsWith('[STAR TEST] 🚨')?'🚨 Unread Help Now message':'🩹 Unread Something Hurts message';
        if(title.textContent!==label)title.textContent=label;
      }
      notice.hidden=!latest;
    }catch(error){
      console.warn('Could not refresh Home help notification',error);
    }finally{refreshing=false;}
  }
  refreshHelpNotice();
  setInterval(refreshHelpNotice,5000);
  window.addEventListener('pageshow',refreshHelpNotice);
  document.addEventListener('visibilitychange',refreshHelpNotice);
</script>
<script defer src="ui-shell.js?v=2026.11.08-roles"></script><script defer src="scripts/appbar-drawer.js?v=2026.11.08-roles"></script></body></html>
